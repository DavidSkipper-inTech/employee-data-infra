AWSTemplateFormatVersion: '2010-09-09'
Description: Employee data pipeline - Lambda export, Glue transform, Athena

Parameters:
  Project:
    Type: String
    Default: employee-data-david
  EcsCluster:
    Type: String
    Default: employee-api-cluster
  EcsService:
    Type: String
    Default: employee-api-service
  DatabaseName:
    Type: String
    Default: employee_data
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Project}-${AWS::AccountId}